profiles:
  android_emulator:
    platform: android
    target_type: simulator
    device_name: Android Emulator
    # avd: Pixel_8_API_35  # optional; auto-attaches to running emulator or first available AVD
    automation_name: UiAutomator2
    auto_accept_alerts: true
    capabilities:
      appWaitActivity: "*"

  android_device:
    platform: android
    target_type: device
    device_name: Android Device
    automation_name: UiAutomator2
    auto_accept_alerts: true

  ios_simulator:
    platform: ios
    target_type: simulator
    device_name: iPhone 17
    platform_version: "26.5"
    automation_name: XCUITest
    auto_accept_alerts: true

  ios_device:
    platform: ios
    target_type: device
    device_name: iPhone Device
    automation_name: XCUITest
    auto_accept_alerts: true
