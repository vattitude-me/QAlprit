# Tangerine non-prod app (ca.tangerine.mobile.banking.app.nonProd), logged-in areas.
# Compose test tags have no package prefix, so they use resourceId() selectors.
tng_debug:
  title:
    android: {text: Debug Menu}
  apply_and_continue_btn:
    android: {text: Apply and Continue}
tng_pin:
