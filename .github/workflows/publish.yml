name: Publish QAlprit Release & Windows Installer

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      desktop:
        description: "Build the Windows .exe and macOS .dmg installers"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      - name: Build distributions
        run: |
          python -m build
          twine check dist/*
      - name: Publish to PyPI via Trusted Publishing
        # A manual run only builds test installers. PyPI versions cannot be re-uploaded, so publish on releases only.
        if: github.event_name == 'release'
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1

  build-windows-exe:
    # Desktop installers are paused by default. Turn them on for one run with the
    # "desktop" input, or for every release with the repo variable BUILD_DESKTOP=true.
    if: vars.BUILD_DESKTOP == 'true' || inputs.desktop == true
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build Standalone Windows Installer (.exe)
        shell: powershell
        run: |
          $tag = "${{ github.ref_name }}"
          if ("${{ github.event_name }}" -eq "release" -and $tag.StartsWith("v")) {
            $ver = $tag.Substring(1)
            & .\packaging\windows\build_win.ps1 -Version $ver
          } else {
            & .\packaging\windows\build_win.ps1
          }
      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qalprit-windows-installer
          path: |
            dist-win/QAlprit-Setup-*.exe
            dist-win/SHA256SUMS.txt
      - name: Attach Windows Installer to GitHub Release
        if: github.event_name == 'release'
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" dist-win\QAlprit-Setup-*.exe dist-win\SHA256SUMS.txt --clobber

  build-macos-dmg:
    # Desktop installers are paused by default. Turn them on for one run with the
    # "desktop" input, or for every release with the repo variable BUILD_DESKTOP=true.
    if: vars.BUILD_DESKTOP == 'true' || inputs.desktop == true
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build Standalone macOS App & DMG
        shell: bash
        run: |
          chmod +x packaging/macos/build_mac.sh
          TAG="${{ github.ref_name }}"
          if [[ "${{ github.event_name }}" == "release" && "${TAG}" == v* ]]; then
            ./packaging/macos/build_mac.sh "${TAG#v}"
          else
            ./packaging/macos/build_mac.sh
          fi
      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qalprit-macos-dmg
          path: |
            dist-mac/QAlprit-*.dmg
            dist-mac/SHA256SUMS-mac.txt
      - name: Attach macOS DMG to GitHub Release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" dist-mac/QAlprit-*.dmg dist-mac/SHA256SUMS-mac.txt --clobber
