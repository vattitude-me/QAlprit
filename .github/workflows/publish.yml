name: Publish QAlprit Release & Windows Installer

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      - name: Build distributions
        run: |
          python -m build
          twine check dist/*
      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1

  build-windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build Standalone Windows Installer (.exe)
        shell: powershell
        run: |
          $tag = "${{ github.ref_name }}"
          if ("${{ github.event_name }}" -eq "release" -and $tag.StartsWith("v")) {
            $ver = $tag.Substring(1)
            & .\packaging\windows\build_win.ps1 -Version $ver
          } else {
            & .\packaging\windows\build_win.ps1
          }
      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qalprit-windows-installer
          path: |
            dist-win/QAlprit-Setup-*.exe
            dist-win/SHA256SUMS.txt
      - name: Attach Windows Installer to GitHub Release
        if: github.event_name == 'release'
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" dist-win\QAlprit-Setup-*.exe dist-win\SHA256SUMS.txt --clobber
