<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 480" width="1080" height="480" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">QAlprit Architecture Flow</title>
  <desc id="arch-desc">Animated flow from app build artifact and AI-authored specs through human plus QAlprit validation, workflow execution on simulator or real device, in-memory screen masking, to proof reports and dashboard.</desc>
  <defs>
    <marker id="arr-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4f46e5" />
    </marker>
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0891b2" />
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e" />
    </marker>
    <marker id="arr-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e11d48" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
    </marker>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .flow-line {
        fill: none;
        stroke-width: 2.8;
        stroke-linecap: round;
        stroke-dasharray: 10 7;
        animation: dash-forward 1.1s linear infinite;
      }
      @keyframes dash-forward {
        from { stroke-dashoffset: 34; }
        to { stroke-dashoffset: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .flow-line { animation: none; stroke-dasharray: none; }
      }
    </style>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1080" height="480" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />

  <!-- Header -->
  <rect x="24" y="18" width="1032" height="56" rx="12" fill="#0f172a" />
  <text x="46" y="43" class="sans" font-size="18.5" font-weight="700" fill="#f8fafc">QAlprit Architecture</text>
  <text x="46" y="61" class="sans" font-size="12" fill="#94a3b8">Build -&gt; AI Authoring -&gt; Validate -&gt; Execute -&gt; Mask -&gt; Dashboard</text>
  <rect x="880" y="30" width="154" height="32" rx="16" fill="#134e4a" stroke="#2dd4bf" stroke-width="1.2" />
  <text x="957" y="50" text-anchor="middle" class="mono" font-size="11.5" font-weight="600" fill="#2dd4bf">Deterministic Core</text>

  <!-- 1: App Build -->
  <rect x="44" y="102" width="286" height="124" rx="14" fill="#ffffff" stroke="#818cf8" stroke-width="2" />
  <circle cx="68" cy="128" r="13" fill="#4f46e5" />
  <text x="68" y="133" text-anchor="middle" class="sans" font-size="12.5" font-weight="700" fill="#ffffff">1</text>
  <text x="90" y="133" class="sans" font-size="15" font-weight="700" fill="#1e1b4b">App Build</text>
  <rect x="60" y="150" width="254" height="32" rx="8" fill="#eef2ff" stroke="#c7d2fe" />
  <text x="187" y="170" text-anchor="middle" class="mono" font-size="12.5" font-weight="700" fill="#3730a3">.apk / .app / .ipa</text>
  <text x="187" y="206" text-anchor="middle" class="sans" font-size="12" fill="#475569">Target Mobile Binary</text>

  <!-- 1 -> 2 -->
  <path class="flow-line" d="M 330 164 L 390 164" stroke="#4f46e5" marker-end="url(#arr-indigo)" />
  <text x="360" y="152" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#4f46e5">target</text>

  <!-- 2: AI Spec Authoring -->
  <rect x="396" y="102" width="286" height="124" rx="14" fill="#ffffff" stroke="#22d3ee" stroke-width="2" />
  <circle cx="420" cy="128" r="13" fill="#0891b2" />
  <text x="420" y="133" text-anchor="middle" class="sans" font-size="12.5" font-weight="700" fill="#ffffff">2</text>
  <text x="442" y="133" class="sans" font-size="15" font-weight="700" fill="#164e63">AI Authoring</text>
  <rect x="412" y="150" width="254" height="32" rx="8" fill="#ecfeff" stroke="#a5f3fc" />
  <text x="539" y="170" text-anchor="middle" class="mono" font-size="12.5" font-weight="700" fill="#0e7490">Screens · Flows · Specs</text>
  <text x="539" y="206" text-anchor="middle" class="sans" font-size="12" fill="#475569">YAML &amp; Markdown Suites</text>

  <!-- 2 -> 3 -->
  <path class="flow-line" d="M 682 164 L 742 164" stroke="#0891b2" marker-end="url(#arr-cyan)" />
  <text x="712" y="152" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#0891b2">author</text>

  <!-- 3: Validate -->
  <rect x="748" y="102" width="286" height="124" rx="14" fill="#ffffff" stroke="#2dd4bf" stroke-width="2" />
  <circle cx="772" cy="128" r="13" fill="#0f766e" />
  <text x="772" y="133" text-anchor="middle" class="sans" font-size="12.5" font-weight="700" fill="#ffffff">3</text>
  <text x="794" y="133" class="sans" font-size="15" font-weight="700" fill="#134e4a">Validate</text>
  <rect x="764" y="150" width="254" height="32" rx="8" fill="#f0fdfa" stroke="#99f6e4" />
  <text x="891" y="170" text-anchor="middle" class="mono" font-size="12.5" font-weight="700" fill="#0f766e">Human + qalprit validate</text>
  <text x="891" y="206" text-anchor="middle" class="sans" font-size="12" fill="#475569">Schema, Locators &amp; .env</text>

  <!-- 3 -> 4 -->
  <path class="flow-line" d="M 891 226 L 891 284" stroke="#0f766e" marker-end="url(#arr-teal)" />
  <rect x="904" y="244" width="66" height="22" rx="11" fill="#f0fdfa" stroke="#99f6e4" />
  <text x="937" y="259" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#0f766e">execute</text>

  <!-- 4: Workflow Execution -->
  <rect x="748" y="290" width="286" height="162" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="2" />
  <circle cx="772" cy="316" r="13" fill="#16a34a" />
  <text x="772" y="321" text-anchor="middle" class="sans" font-size="12.5" font-weight="700" fill="#ffffff">4</text>
  <text x="794" y="321" class="sans" font-size="15" font-weight="700" fill="#14532d">Workflow Execution</text>
  <text x="764" y="347" class="mono" font-size="12" font-weight="600" fill="#15803d">qalprit run</text>
  <rect x="764" y="362" width="254" height="74" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" />
  <text x="891" y="392" text-anchor="middle" class="sans" font-size="13.5" font-weight="700" fill="#14532d">Simulator / Real Device</text>
  <text x="891" y="416" text-anchor="middle" class="mono" font-size="11.5" fill="#15803d">Appium 2 · Step Runner</text>

  <!-- 4 -> 5 -->
  <path class="flow-line" d="M 748 371 L 688 371" stroke="#e11d48" marker-end="url(#arr-rose)" />
  <text x="718" y="359" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#e11d48">capture</text>

  <!-- 5: Capture & Mask -->
  <rect x="396" y="290" width="286" height="162" rx="14" fill="#ffffff" stroke="#fb7185" stroke-width="2" />
  <circle cx="420" cy="316" r="13" fill="#e11d48" />
  <text x="420" y="321" text-anchor="middle" class="sans" font-size="12.5" font-weight="700" fill="#ffffff">5</text>
  <text x="442" y="321" class="sans" font-size="15" font-weight="700" fill="#881337">Capture &amp; Mask</text>
  <rect x="412" y="342" width="254" height="32" rx="8" fill="#fff1f2" stroke="#fda4af" />
  <text x="539" y="362" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#be123c">In-Memory RAM Redaction</text>
  <text x="539" y="401" text-anchor="middle" class="sans" font-size="12" fill="#334155">Screen Capture + PII Masking</text>
  <text x="539" y="425" text-anchor="middle" class="sans" font-size="12" font-weight="700" fill="#be123c">Zero Raw Secrets on Disk</text>

  <!-- 5 -> 6 -->
  <path class="flow-line" d="M 396 371 L 336 371" stroke="#d97706" marker-end="url(#arr-amber)" />
  <text x="366" y="359" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#b45309">publish</text>

  <!-- 6: Report & Dashboard -->
  <rect x="44" y="290" width="286" height="162" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" />
  <circle cx="68" cy="316" r="13" fill="#d97706" />
  <text x="68" y="321" text-anchor="middle" class="sans" font-size="12.5" font-weight="700" fill="#ffffff">6</text>
  <text x="90" y="321" class="sans" font-size="15" font-weight="700" fill="#78350f">Report &amp; Dashboard</text>

  <rect x="60" y="342" width="121" height="44" rx="8" fill="#ffffff" stroke="#fcd34d" />
  <text x="120" y="361" text-anchor="middle" class="mono" font-size="11.5" font-weight="700" fill="#0f172a">report.html</text>
  <text x="120" y="377" text-anchor="middle" class="sans" font-size="10.5" fill="#475569">Screenshots</text>

  <rect x="193" y="342" width="121" height="44" rx="8" fill="#ffffff" stroke="#fcd34d" />
  <text x="253" y="361" text-anchor="middle" class="mono" font-size="11.5" font-weight="700" fill="#0f172a">results.json</text>
  <text x="253" y="377" text-anchor="middle" class="sans" font-size="10.5" fill="#475569">Pass / Fail</text>

  <rect x="60" y="396" width="121" height="44" rx="8" fill="#ffffff" stroke="#fcd34d" />
  <text x="120" y="415" text-anchor="middle" class="mono" font-size="11.5" font-weight="700" fill="#0f172a">summary.md</text>
  <text x="120" y="431" text-anchor="middle" class="sans" font-size="10.5" fill="#475569">PR Summary</text>

  <rect x="193" y="396" width="121" height="44" rx="8" fill="#ffffff" stroke="#fcd34d" />
  <text x="253" y="415" text-anchor="middle" class="mono" font-size="11.5" font-weight="700" fill="#0f172a">qalprit ui</text>
  <text x="253" y="431" text-anchor="middle" class="sans" font-size="10.5" fill="#475569">Dashboard</text>

  <!-- Animated Flow Pulses -->
  <circle r="4.5" fill="#4f46e5">
    <animateMotion dur="1.4s" repeatCount="indefinite" path="M 330 164 L 390 164" />
  </circle>
  <circle r="4.5" fill="#0891b2">
    <animateMotion dur="1.4s" begin="0.3s" repeatCount="indefinite" path="M 682 164 L 742 164" />
  </circle>
  <circle r="4.5" fill="#0f766e">
    <animateMotion dur="1.2s" begin="0.6s" repeatCount="indefinite" path="M 891 226 L 891 284" />
  </circle>
  <circle r="4.5" fill="#e11d48">
    <animateMotion dur="1.4s" begin="0.9s" repeatCount="indefinite" path="M 748 371 L 688 371" />
  </circle>
  <circle r="4.5" fill="#d97706">
    <animateMotion dur="1.4s" begin="1.2s" repeatCount="indefinite" path="M 396 371 L 336 371" />
  </circle>
</svg>
