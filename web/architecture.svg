<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" width="1080" height="560" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">QAlprit Event Flow Diagram</title>
  <desc id="arch-desc">Animated flow showing how QAlprit turns plain test specs into phone actions, blacks out secrets in memory, and outputs proof reports.</desc>
  <defs>
    <marker id="arr-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5b3df5" />
    </marker>
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0891b2" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arr-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e11d48" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
    </marker>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .flow-line {
        fill: none;
        stroke-width: 2.8;
        stroke-linecap: round;
        stroke-dasharray: 10 7;
        animation: dash-forward 1.1s linear infinite;
      }
      .flow-return {
        fill: none;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-dasharray: 8 7;
        animation: dash-forward 1.4s linear infinite;
      }
      @keyframes dash-forward {
        from { stroke-dashoffset: 34; }
        to { stroke-dashoffset: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .flow-line, .flow-return { animation: none; stroke-dasharray: none; }
      }
    </style>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1080" height="560" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />

  <!-- Title Bar -->
  <rect x="20" y="18" width="1040" height="58" rx="12" fill="#0f172a" />
  <text x="42" y="44" class="sans" font-size="19" font-weight="700" fill="#f8fafc">How QAlprit Works — Event Flow</text>
  <text x="42" y="63" class="sans" font-size="12.5" fill="#94a3b8">Write simple steps -&gt; Check setup -&gt; Tap through phone -&gt; Black out secrets -&gt; Save proof</text>
  <rect x="890" y="31" width="150" height="32" rx="16" fill="#1e293b" stroke="#334155" />
  <text x="965" y="51" text-anchor="middle" class="mono" font-size="11.5" font-weight="600" fill="#38bdf8">No AI guessing</text>

  <!-- STEP 1: Write Test -->
  <rect x="34" y="110" width="210" height="148" rx="14" fill="#ffffff" stroke="#818cf8" stroke-width="2" />
  <circle cx="58" cy="136" r="13" fill="#5b3df5" />
  <text x="58" y="141" text-anchor="middle" class="sans" font-size="12.5" font-weight="700" fill="#ffffff">1</text>
  <text x="80" y="141" class="sans" font-size="14.5" font-weight="700" fill="#1e1b4b">Write a Test</text>
  <text x="50" y="170" class="mono" font-size="11.5" font-weight="600" fill="#4338ca">specs/*.md</text>
  <text x="50" y="188" class="sans" font-size="11.5" fill="#475569">Steps like tap, type, scroll</text>
  <text x="50" y="212" class="mono" font-size="11.5" font-weight="600" fill="#4338ca">screens.yaml + .env</text>
  <text x="50" y="230" class="sans" font-size="11.5" fill="#475569">Buttons + passwords (secret)</text>

  <!-- Animated Line 1 -> 2 -->
  <path id="p12" class="flow-line" d="M 244 184 L 298 184" stroke="#5b3df5" marker-end="url(#arr-indigo)" />
  <text x="272" y="172" text-anchor="middle" class="sans" font-size="10.5" font-weight="600" fill="#5b3df5">read</text>

  <!-- STEP 2: Check Setup -->
  <rect x="304" y="110" width="210" height="148" rx="14" fill="#ffffff" stroke="#22d3ee" stroke-width="2" />
  <circle cx="328" cy="136" r="13" fill="#0891b2" />
  <text x="328" y="141" text-anchor="middle" class="sans" font-size="12.5" font-weight="700" fill="#ffffff">2</text>
  <text x="350" y="141" class="sans" font-size="14.5" font-weight="700" fill="#164e63">Check Setup</text>
  <text x="320" y="170" class="mono" font-size="11.5" font-weight="600" fill="#0e7490">qalprit validate</text>
  <text x="320" y="190" class="sans" font-size="11.5" fill="#475569">Catches typos, missing</text>
  <text x="320" y="207" class="sans" font-size="11.5" fill="#475569">buttons, or missing .env</text>
  <text x="320" y="230" class="sans" font-size="11.5" font-weight="600" fill="#0e7490">Fast check before running</text>

  <!-- Animated Line 2 -> 3 -->
  <path id="p23" class="flow-line" d="M 514 184 L 568 184" stroke="#0891b2" marker-end="url(#arr-cyan)" />
  <text x="541" y="172" text-anchor="middle" class="sans" font-size="10.5" font-weight="600" fill="#0891b2">start</text>

  <!-- STEP 3: Run Steps -->
  <rect x="574" y="110" width="222" height="148" rx="14" fill="#ffffff" stroke="#4ade80" stroke-width="2" />
  <circle cx="598" cy="136" r="13" fill="#16a34a" />
  <text x="598" y="141" text-anchor="middle" class="sans" font-size="12.5" font-weight="700" fill="#ffffff">3</text>
  <text x="620" y="141" class="sans" font-size="14.5" font-weight="700" fill="#14532d">Run Each Step</text>
  <text x="590" y="170" class="mono" font-size="11.5" font-weight="600" fill="#15803d">qalprit run</text>
  <text x="590" y="190" class="sans" font-size="11.5" fill="#475569">Auto-starts Appium 2</text>
  <text x="590" y="208" class="sans" font-size="11.5" fill="#475569">Waits for buttons &amp; taps</text>
  <text x="590" y="230" class="sans" font-size="11.5" font-weight="600" fill="#15803d">Always runs cleanup steps</text>

  <!-- Animated Line 3 <-> Phone -->
  <path id="p3phone" class="flow-line" d="M 796 184 L 850 184" stroke="#16a34a" marker-end="url(#arr-green)" />
  <text x="823" y="172" text-anchor="middle" class="sans" font-size="10.5" font-weight="600" fill="#16a34a">tap/type</text>

  <!-- TARGET: Real Phone or Emulator -->
  <rect x="856" y="110" width="190" height="148" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" />
  <text x="951" y="141" text-anchor="middle" class="sans" font-size="14.5" font-weight="700" fill="#14532d">Android / iOS App</text>
  <text x="951" y="168" text-anchor="middle" class="sans" font-size="11.5" fill="#334155">Emulator, Simulator,</text>
  <text x="951" y="185" text-anchor="middle" class="sans" font-size="11.5" fill="#334155">or USB Real Device</text>
  <rect x="884" y="204" width="134" height="34" rx="8" fill="#ffffff" stroke="#86efac" />
  <text x="951" y="225" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#15803d">Appium 2 Driver</text>

  <!-- Animated Return Line: Phone -> Step 4 (Take Screenshot & Hide Secrets) -->
  <path id="pphone4" class="flow-line" d="M 951 258 L 951 312 L 732 312 L 732 356" stroke="#e11d48" marker-end="url(#arr-pink)" />
  <rect x="752" y="299" width="186" height="24" rx="12" fill="#fff1f2" stroke="#fda4af" />
  <text x="845" y="315" text-anchor="middle" class="sans" font-size="11" font-weight="700" fill="#be123c">screen image in RAM</text>

  <!-- STEP 4: Hide Secrets in Memory -->
  <rect x="524" y="362" width="416" height="156" rx="14" fill="#ffffff" stroke="#fb7185" stroke-width="2" />
  <circle cx="550" cy="390" r="13" fill="#e11d48" />
  <text x="550" y="395" text-anchor="middle" class="sans" font-size="12.5" font-weight="700" fill="#ffffff">4</text>
  <text x="572" y="395" class="sans" font-size="14.5" font-weight="700" fill="#881337">Hide Secrets Before Saving</text>
  <text x="542" y="424" class="sans" font-size="12" fill="#334155">• Finds every sensitive box (passwords, credit cards)</text>
  <text x="542" y="446" class="sans" font-size="12" fill="#334155">• Draws solid black boxes over them in memory</text>
  <text x="542" y="468" class="sans" font-size="12" fill="#334155">• Masks secret text in logs and XML error dumps</text>
  <text x="542" y="496" class="sans" font-size="11.5" font-weight="700" fill="#be123c">Unmasked passwords never touch your hard drive</text>

  <!-- Animated Line: Step 4 -> Step 5 -->
  <path id="p45" class="flow-line" d="M 524 440 L 456 440" stroke="#d97706" marker-end="url(#arr-amber)" />
  <text x="490" y="428" text-anchor="middle" class="sans" font-size="10.5" font-weight="600" fill="#b45309">save</text>

  <!-- STEP 5: Proof Output -->
  <rect x="34" y="362" width="416" height="156" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" />
  <circle cx="60" cy="390" r="13" fill="#d97706" />
  <text x="60" y="395" text-anchor="middle" class="sans" font-size="12.5" font-weight="700" fill="#ffffff">5</text>
  <text x="82" y="395" class="sans" font-size="14.5" font-weight="700" fill="#78350f">What Comes Out (Proof)</text>

  <rect x="52" y="412" width="184" height="40" rx="8" fill="#ffffff" stroke="#fcd34d" />
  <text x="64" y="430" class="mono" font-size="11.5" font-weight="700" fill="#0f172a">report.html</text>
  <text x="64" y="445" class="sans" font-size="10.5" fill="#475569">Clickable steps &amp; photos</text>

  <rect x="248" y="412" width="184" height="40" rx="8" fill="#ffffff" stroke="#fcd34d" />
  <text x="260" y="430" class="mono" font-size="11.5" font-weight="700" fill="#0f172a">summary.md</text>
  <text x="260" y="445" class="sans" font-size="10.5" fill="#475569">Short pass/fail table</text>

  <rect x="52" y="462" width="184" height="40" rx="8" fill="#ffffff" stroke="#fcd34d" />
  <text x="64" y="480" class="mono" font-size="11.5" font-weight="700" fill="#0f172a">results.json</text>
  <text x="64" y="495" class="sans" font-size="10.5" fill="#475569">Structured test results</text>

  <rect x="248" y="462" width="184" height="40" rx="8" fill="#ffffff" stroke="#fcd34d" />
  <text x="260" y="480" class="mono" font-size="11.5" font-weight="700" fill="#0f172a">qalprit ui</text>
  <text x="260" y="495" class="sans" font-size="10.5" fill="#475569">Local dashboard viewer</text>

  <!-- Subtle pulse dots traveling along the paths (SMIL animateMotion) -->
  <circle r="4.5" fill="#5b3df5">
    <animateMotion dur="1.4s" repeatCount="indefinite" path="M 244 184 L 298 184" />
  </circle>
  <circle r="4.5" fill="#0891b2">
    <animateMotion dur="1.4s" begin="0.35s" repeatCount="indefinite" path="M 514 184 L 568 184" />
  </circle>
  <circle r="4.5" fill="#16a34a">
    <animateMotion dur="1.4s" begin="0.7s" repeatCount="indefinite" path="M 796 184 L 850 184" />
  </circle>
  <circle r="5" fill="#e11d48">
    <animateMotion dur="2.2s" begin="0.2s" repeatCount="indefinite" path="M 951 258 L 951 312 L 732 312 L 732 356" />
  </circle>
  <circle r="4.5" fill="#d97706">
    <animateMotion dur="1.4s" begin="1.0s" repeatCount="indefinite" path="M 524 440 L 456 440" />
  </circle>
</svg>
