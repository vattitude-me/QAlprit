<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 760" width="1160" height="760" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">QAlprit System Architecture</title>
  <desc id="arch-desc">Four-layer architecture of QAlprit: Authoring and Configuration, Deterministic Execution Core, Appium 2 and Native Targets, and In-Memory Evidence Redaction and Reporting.</desc>
  <defs>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0891b2" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
    </marker>
    <style>
      .font { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>

  <!-- Outer Canvas (opaque light surface so it renders cleanly in both GitHub light & dark themes) -->
  <rect x="0" y="0" width="1160" height="760" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />

  <!-- Header Banner -->
  <rect x="20" y="18" width="1120" height="62" rx="10" fill="#0f172a" />
  <text x="42" y="45" class="font" font-size="20" font-weight="700" fill="#f8fafc">QAlprit Architecture — Mobile QA. Bugs caught with proof.</text>
  <text x="42" y="66" class="font" font-size="12.5" fill="#94a3b8">Deterministic Markdown/YAML Specs · Appium 2 Orchestration · In-Memory Pillow Redaction · Self-Contained Proof Reports</text>
  <rect x="965" y="31" width="154" height="34" rx="17" fill="#1e293b" stroke="#334155" />
  <text x="1042" y="52" text-anchor="middle" class="mono" font-size="12" font-weight="600" fill="#38bdf8">0 Runtime LLMs</text>

  <!-- LAYER 1: Authoring & Configuration -->
  <rect x="20" y="96" width="1120" height="132" rx="12" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5" />
  <text x="38" y="120" class="font" font-size="13" font-weight="700" fill="#312e81">1. AUTHORING &amp; CONFIGURATION</text>
  <text x="295" y="120" class="font" font-size="12" fill="#4338ca">Plain Markdown specs, 1-level reusable flows, logical locators, and local secrets</text>

  <rect x="38" y="134" width="252" height="78" rx="8" fill="#ffffff" stroke="#a5b4fc" stroke-width="1.5" />
  <text x="54" y="157" class="mono" font-size="13" font-weight="700" fill="#0f172a">specs/**/*.md</text>
  <text x="54" y="177" class="font" font-size="11.5" fill="#475569">YAML front matter + Markdown body</text>
  <text x="54" y="195" class="font" font-size="11.5" fill="#475569">steps, teardown, targets, reset</text>

  <rect x="314" y="134" width="252" height="78" rx="8" fill="#ffffff" stroke="#a5b4fc" stroke-width="1.5" />
  <text x="330" y="157" class="mono" font-size="13" font-weight="700" fill="#0f172a">flows/**/*.md</text>
  <text x="330" y="177" class="font" font-size="11.5" fill="#475569">1-level reusable step sequences</text>
  <text x="330" y="195" class="font" font-size="11.5" fill="#475569">run_flow + ${param} substitution</text>

  <rect x="590" y="134" width="252" height="78" rx="8" fill="#ffffff" stroke="#a5b4fc" stroke-width="1.5" />
  <text x="606" y="157" class="mono" font-size="13" font-weight="700" fill="#0f172a">screens/screens.yaml</text>
  <text x="606" y="177" class="font" font-size="11.5" fill="#475569">accessibility_id + platform overrides</text>
  <text x="606" y="195" class="font" font-size="11.5" fill="#b45309" font-weight="600">sensitive: true auto-redaction</text>

  <rect x="866" y="134" width="256" height="78" rx="8" fill="#ffffff" stroke="#a5b4fc" stroke-width="1.5" />
  <text x="882" y="157" class="mono" font-size="13" font-weight="700" fill="#0f172a">config/ + .env</text>
  <text x="882" y="177" class="font" font-size="11.5" fill="#475569">devices.yaml &amp; environments.yaml</text>
  <text x="882" y="195" class="font" font-size="11.5" fill="#475569">Stdlib .env + RFC 6238 ${TOTP:VAR}</text>

  <!-- Connector arrows Layer 1 -> Layer 2 -->
  <line x1="164" y1="212" x2="420" y2="262" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow-slate)" />
  <line x1="440" y1="212" x2="440" y2="262" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow-slate)" />
  <line x1="716" y1="212" x2="475" y2="262" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow-slate)" />
  <line x1="994" y1="212" x2="505" y2="262" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow-slate)" />

  <!-- LAYER 2: Deterministic Core -->
  <rect x="20" y="250" width="1120" height="142" rx="12" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.5" />
  <text x="38" y="274" class="font" font-size="13" font-weight="700" fill="#164e63">2. DETERMINISTIC EXECUTION CORE (src/qalprit/)</text>

  <rect x="38" y="288" width="234" height="88" rx="8" fill="#ffffff" stroke="#22d3ee" stroke-width="1.5" />
  <text x="54" y="311" class="mono" font-size="13" font-weight="700" fill="#0f172a">qalprit CLI</text>
  <text x="54" y="331" class="mono" font-size="11" fill="#0e7490">doctor · devices · inspect</text>
  <text x="54" y="349" class="mono" font-size="11" fill="#0e7490">validate · run · report · ui</text>
  <text x="54" y="366" class="font" font-size="11" fill="#64748b">Click entry point</text>

  <rect x="304" y="288" width="256" height="88" rx="8" fill="#ffffff" stroke="#22d3ee" stroke-width="1.5" />
  <text x="320" y="311" class="font" font-size="13" font-weight="700" fill="#0f172a">Fail-Fast Validator</text>
  <text x="320" y="331" class="font" font-size="11.5" fill="#475569">Validates step vocabulary, 1-level</text>
  <text x="320" y="349" class="font" font-size="11.5" fill="#475569">flows, locator targets, template</text>
  <text x="320" y="366" class="font" font-size="11.5" fill="#475569">params &amp; env vars pre-flight</text>

  <rect x="592" y="288" width="278" height="88" rx="8" fill="#ffffff" stroke="#22d3ee" stroke-width="1.5" />
  <text x="608" y="311" class="font" font-size="13" font-weight="700" fill="#0f172a">TestRunner &amp; Step Engine</text>
  <text x="608" y="331" class="font" font-size="11.5" fill="#475569">Suite session reuse &amp; state reset</text>
  <text x="608" y="349" class="font" font-size="11.5" fill="#475569">Auto-wait readiness · target gating</text>
  <text x="608" y="366" class="font" font-size="11.5" fill="#475569">Guaranteed teardown · retries/flaky</text>

  <rect x="902" y="288" width="220" height="88" rx="8" fill="#ffffff" stroke="#22d3ee" stroke-width="1.5" />
  <text x="918" y="311" class="font" font-size="13" font-weight="700" fill="#0f172a">AppiumManager</text>
  <text x="918" y="331" class="font" font-size="11.5" fill="#475569">Auto-starts &amp; stops local</text>
  <text x="918" y="349" class="font" font-size="11.5" fill="#475569">Appium 2 subprocess or</text>
  <text x="918" y="366" class="font" font-size="11.5" fill="#475569">attaches via --appium-url</text>

  <!-- Layer 2 horizontal arrows -->
  <line x1="272" y1="332" x2="300" y2="332" stroke="#0891b2" stroke-width="1.8" marker-end="url(#arrow-cyan)" />
  <line x1="560" y1="332" x2="588" y2="332" stroke="#0891b2" stroke-width="1.8" marker-end="url(#arrow-cyan)" />
  <line x1="870" y1="332" x2="898" y2="332" stroke="#0891b2" stroke-width="1.8" marker-end="url(#arrow-cyan)" />

  <!-- Connector arrows Layer 2 -> Layer 3 -->
  <line x1="730" y1="376" x2="230" y2="446" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow-green)" />
  <line x1="1012" y1="376" x2="275" y2="446" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow-green)" />

  <!-- LAYER 3: Appium 2 & Native Targets -->
  <rect x="20" y="416" width="1120" height="122" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5" />
  <text x="38" y="440" class="font" font-size="13" font-weight="700" fill="#14532d">3. APPIUM 2 &amp; NATIVE MOBILE TARGETS</text>

  <rect x="38" y="452" width="330" height="72" rx="8" fill="#ffffff" stroke="#4ade80" stroke-width="1.5" />
  <text x="54" y="476" class="font" font-size="13" font-weight="700" fill="#0f172a">Appium 2 Server</text>
  <text x="54" y="495" class="font" font-size="11.5" fill="#475569">UiAutomator2 &amp; XCUITest W3C WebDriver</text>
  <text x="54" y="512" class="mono" font-size="11" fill="#15803d">Streams server output -&gt; appium.log</text>

  <rect x="404" y="452" width="344" height="72" rx="8" fill="#ffffff" stroke="#4ade80" stroke-width="1.5" />
  <text x="420" y="476" class="font" font-size="13" font-weight="700" fill="#0f172a">Android Targets (macOS / Linux / Win)</text>
  <text x="420" y="495" class="font" font-size="11.5" fill="#475569">Android Emulator (AVD) &amp; Real Devices</text>
  <text x="420" y="512" class="mono" font-size="11" fill="#15803d">.apk · adb shell pm clear · biometric</text>

  <rect x="784" y="452" width="338" height="72" rx="8" fill="#ffffff" stroke="#4ade80" stroke-width="1.5" />
  <text x="800" y="476" class="font" font-size="13" font-weight="700" fill="#0f172a">iOS Targets (macOS + Xcode)</text>
  <text x="800" y="495" class="font" font-size="11.5" fill="#475569">iOS Simulator &amp; Real Devices (WDA)</text>
  <text x="800" y="512" class="mono" font-size="11" fill="#15803d">.app / .ipa · simctl · Face ID / Touch ID</text>

  <!-- Layer 3 horizontal arrows -->
  <line x1="368" y1="488" x2="400" y2="488" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow-green)" />
  <path d="M 203 524 L 203 534 L 953 534 L 953 526" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)" />

  <!-- Connector Runner/Appium -> Layer 4 Evidence -->
  <line x1="730" y1="376" x2="215" y2="594" stroke="#d97706" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrow-amber)" />

  <!-- LAYER 4: Security-First Evidence & Reporting -->
  <rect x="20" y="562" width="1120" height="172" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5" />
  <text x="38" y="586" class="font" font-size="13" font-weight="700" fill="#78350f">4. IN-MEMORY EVIDENCE REDACTION &amp; REPORTING</text>
  <text x="410" y="586" class="font" font-size="12" fill="#92400e">Raw secret pixels and plaintext credentials never touch disk</text>

  <rect x="38" y="600" width="350" height="116" rx="8" fill="#ffffff" stroke="#fbbf24" stroke-width="1.5" />
  <text x="54" y="624" class="font" font-size="13" font-weight="700" fill="#0f172a">EvidenceCollector (In-Memory Pillow)</text>
  <text x="54" y="644" class="font" font-size="11.5" fill="#475569">1. Scales rect bounds (screenshot / window px)</text>
  <text x="54" y="662" class="font" font-size="11.5" fill="#475569">2. Black-fills secret: true &amp; sensitive: true boxes</text>
  <text x="54" y="680" class="font" font-size="11.5" fill="#475569">3. SecretMasker scrubs logs &amp; failure XML</text>
  <text x="54" y="698" class="font" font-size="11.5" fill="#b45309" font-weight="600">4. Flags embedded WebViews (C8)</text>

  <rect x="418" y="600" width="334" height="116" rx="8" fill="#ffffff" stroke="#fbbf24" stroke-width="1.5" />
  <text x="434" y="624" class="mono" font-size="13" font-weight="700" fill="#0f172a">results/&lt;run-id&gt;/</text>
  <text x="434" y="644" class="mono" font-size="11.5" fill="#475569">results.json        (masked source of truth)</text>
  <text x="434" y="662" class="mono" font-size="11.5" fill="#475569">screenshots/*.png   (redacted full-res PNG)</text>
  <text x="434" y="680" class="mono" font-size="11.5" fill="#475569">page_sources/*.xml  (on step failure)</text>
  <text x="434" y="698" class="mono" font-size="11.5" fill="#475569">appium.log          (Appium server log)</text>

  <rect x="782" y="600" width="340" height="116" rx="8" fill="#ffffff" stroke="#fbbf24" stroke-width="1.5" />
  <text x="798" y="624" class="font" font-size="13" font-weight="700" fill="#0f172a">Proof Reports &amp; User Interface</text>
  <text x="798" y="644" class="font" font-size="11.5" fill="#475569">• report.html (Jinja2 + WebP/JPEG compressed)</text>
  <text x="798" y="662" class="font" font-size="11.5" fill="#475569">• summary.md (CI / PR comment summary)</text>
  <text x="798" y="680" class="font" font-size="11.5" fill="#475569">• qalprit ui (local run &amp; spec workbench)</text>
  <text x="798" y="698" class="font" font-size="11.5" fill="#475569">• Vercel Web UI (live interactive proof viewer)</text>

  <!-- Layer 4 horizontal arrows -->
  <line x1="388" y1="658" x2="414" y2="658" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrow-amber)" />
  <line x1="752" y1="658" x2="778" y2="658" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrow-amber)" />
</svg>
