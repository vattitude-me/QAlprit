[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qalprit"
version = "0.1.1"
description = "Mobile QA. Bugs caught with proof. Deterministic Markdown/YAML mobile UI test automation powered by Appium 2."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Srivatsan Sridhar", email = "vatsakrish@gmail.com"},
]
requires-python = ">=3.10"
keywords = ["mobile", "qa", "appium", "android", "ios", "testing", "automation", "redaction"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "Appium-Python-Client>=4.0.0",
    "PyYAML>=6.0.1",
    "python-frontmatter>=1.1.0",
    "Jinja2>=3.1.3",
    "pydantic>=2.6.0",
    "click>=8.1.7",
    "Pillow>=10.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.urls]
Homepage = "https://qalprit.vattitude.ca"
Repository = "https://github.com/vattitude-me/QAlprit"
Issues = "https://github.com/vattitude-me/QAlprit/issues"
Documentation = "https://github.com/vattitude-me/QAlprit#readme"
Demo = "https://qalprit.vattitude.ca/sample-report"

[project.scripts]
qalprit = "qalprit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qalprit = ["report/templates/*.j2", "ui/*.html", "ui/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
